<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>History · SummarAI</title><link rel="stylesheet" href="/css/style.css"><script src="/js/main.js"></script></head><body><div id="nav"></div><main class="wrap">
<section><h1>History</h1><div class="row" style="margin-bottom:16px"><div style="flex:1;min-width:220px"><label for="q" class="meta">Search</label><input id="q" type="search" placeholder="Search title or text"></div>
<div class="chips" role="group" aria-label="Filter by length"><button class="btn" data-type="" aria-pressed="true">All</button><button class="btn" data-type="short" aria-pressed="false">Short</button><button class="btn" data-type="medium" aria-pressed="false">Medium</button><button class="btn" data-type="detailed" aria-pressed="false">Detailed</button></div></div>
<div class="grid" id="list"></div></section>
<dialog id="dlg" aria-labelledby="dt"><h2 id="dt"></h2><p class="meta" id="dm"></p><h3>Summary</h3><p id="ds" style="white-space:pre-wrap"></p><h3>Original text</h3><p id="do" style="white-space:pre-wrap;max-height:240px;overflow:auto"></p><button class="btn" id="close">Close</button></dialog>
</main><div id="foot"></div><script src="/js/history.js"></script></body></html>
